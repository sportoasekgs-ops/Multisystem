<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neustart läuft – Buchungssystem</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .spinner {
            width: 56px; height: 56px;
            border: 5px solid #fce4ec;
            border-top-color: #E91E63;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 1.2rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.5rem; }
        p  { color: #6c757d; font-size: 0.9rem; margin-bottom: 1.2rem; line-height: 1.6; }
        .progress-bar {
            height: 6px; background: #fce4ec; border-radius: 3px; overflow: hidden; margin-bottom: 1.2rem;
        }
        .progress-fill {
            height: 100%; background: #E91E63; border-radius: 3px;
            width: 0%; transition: width 0.3s ease;
        }
        .status { font-size: 0.8rem; color: #9ca3af; }
        .btn {
            display: inline-block; margin-top: 1.2rem;
            padding: 0.6rem 1.4rem; background: #E91E63; color: #fff;
            border-radius: 8px; text-decoration: none; font-size: 0.9rem;
            font-weight: 600; display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">App wird neu gestartet…</h1>
    <p id="msg">Die Datenbank-URL wurde gespeichert. Die App startet jetzt neu und verbindet sich mit der Datenbank.</p>
    <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
    <div class="status" id="status">Warte auf Neustart…</div>
    <a href="/setup/welcome" class="btn" id="btn">Weiter zum Setup →</a>
</div>
<script>
    const bar    = document.getElementById('bar');
    const status = document.getElementById('status');
    const title  = document.getElementById('title');
    const msg    = document.getElementById('msg');
    const btn    = document.getElementById('btn');
    const spinner = document.getElementById('spinner');

    let attempts = 0;
    const maxAttempts = 40;   // 40 × 1.5 s = 60 s Timeout
    const waitBefore  = 3000; // 3 s warten bevor erster Ping

    function ping() {
        attempts++;
        const pct = Math.min((attempts / maxAttempts) * 100, 95);
        bar.style.width = pct + '%';

        // redirect: 'manual' verhindert, dass fetch Redirects automatisch folgt.
        // Im Bootstrap-Modus gibt /setup/welcome einen 302 zurück (opaqueredirect, status=0).
        // Nach dem Neustart mit echter DB gibt /setup/welcome direkt 200 zurück → fertig.
        fetch('/setup/welcome', { method: 'HEAD', redirect: 'manual' })
            .then(r => {
                if (r.type === 'opaqueredirect' || r.status === 0) {
                    // Noch im Bootstrap-Modus oder App startet noch – warten
                    retry();
                } else if (r.ok || r.status === 200) {
                    bar.style.width = '100%';
                    spinner.style.borderTopColor = '#22c55e';
                    title.textContent = '✅ Neustart abgeschlossen!';
                    msg.textContent   = 'Die App läuft jetzt mit der neuen Datenbank.';
                    status.textContent = 'Weiterleitung in 2 Sekunden…';
                    btn.style.display = 'inline-block';
                    setTimeout(() => { window.location.href = '/setup/welcome'; }, 2000);
                } else {
                    retry();
                }
            })
            .catch(() => retry());
    }

    function retry() {
        if (attempts >= maxAttempts) {
            status.textContent = 'Timeout – bitte Seite manuell neu laden.';
            btn.style.display = 'inline-block';
            return;
        }
        status.textContent = `Warte… (Versuch ${attempts}/${maxAttempts})`;
        setTimeout(ping, 1500);
    }

    setTimeout(ping, waitBefore);
</script>
</body>
</html>
