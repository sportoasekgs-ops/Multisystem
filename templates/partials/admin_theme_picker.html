<div class="admin-theme-bar{% if compact %} nav-admin-theme{% endif %}" role="group" aria-label="Seiten-Design wählen">
    <span class="admin-theme-bar-label">🎨 Seiten-Design</span>
    <div class="admin-theme-options">
        <button type="button" class="admin-theme-btn" data-admin-theme="classic" title="Neo-Brutalist: knallige Farben, harte Schatten, Poppins">
            <span class="admin-theme-swatch admin-theme-swatch--classic"></span> Klassisch
        </button>
        <button type="button" class="admin-theme-btn" data-admin-theme="professional" title="Corporate: Raster-Hintergrund, Inter, Tabellen-Look">
            <span class="admin-theme-swatch admin-theme-swatch--professional"></span> Professionell
        </button>
        <button type="button" class="admin-theme-btn" data-admin-theme="minimal" title="Swiss: Schwarz-Weiß, eckig, Mono-Typo, kein Schnickschnack">
            <span class="admin-theme-swatch admin-theme-swatch--minimal"></span> Minimal
        </button>
        <button type="button" class="admin-theme-btn" data-admin-theme="elegant" title="Luxury: Serifen, Glassmorphism, weiche Verläufe">
            <span class="admin-theme-swatch admin-theme-swatch--elegant"></span> Elegant
        </button>
    </div>
</div>
