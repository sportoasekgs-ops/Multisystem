{% extends "base.html" %}

{% block title %}Seite nicht gefunden (404){% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 60px auto; text-align: center; padding: 40px; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);">
    <div style="font-size: 80px; margin-bottom: 20px;">🕵️</div>
    <h1 style="color: #1f2937; margin-bottom: 16px; font-size: 28px;">Oops! Seite nicht gefunden</h1>
    <p style="color: #4b5563; margin-bottom: 30px; font-size: 16px; line-height: 1.6;">
        Die gesuchte Seite existiert leider nicht oder wurde verschoben.<br>
        Fehlercode: 404
    </p>
    
    <a href="{{ url_for('dashboard') }}" 
       style="display: inline-block; padding: 12px 24px; background: {{ branding.primary_color }}; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; transition: opacity 0.2s;">
        Zurück zur Startseite
    </a>
</div>
{% endblock %}
