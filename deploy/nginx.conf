server {
    listen 80;
    server_name igsbadenstedt.learngrid.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name igsbadenstedt.learngrid.app;

    ssl_certificate     /etc/letsencrypt/live/igsbadenstedt.learngrid.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/igsbadenstedt.learngrid.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 16M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /static/ {
        alias /opt/buchungssystem/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
